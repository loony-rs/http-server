edition = "2021"

# Line width — 100 gives room for longer match arms and chained calls
# without forcing awkward wraps, while staying readable in split view.
max_width = 100

# Spaces, not tabs.
hard_tabs = false
tab_spaces = 4

# LF only.
newline_style = "Unix"

# Trailing comma only when the item is already broken across lines.
match_block_trailing_comma = true

# Let rustfmt decide when to collapse short items onto one line.
use_small_heuristics = "Default"

# Always sort use statements.
reorder_imports = true
reorder_modules = true

# Remove redundant parentheses.
remove_nested_parens = true

# ── Nightly-only options ─────────────────────────────────────────────────────
# Uncomment these and add `unstable_features = true` if you run nightly.
#
# unstable_features = true
# trailing_comma = "Vertical"        # trailing comma only on multiline items
# normalize_doc_attributes = true    # normalise #[doc = "..."] to ///
# imports_granularity = "Module"     # merge `use a::b; use a::c;` → `use a::{b,c};`
# group_imports = "StdExternalCrate" # std → external crates → self/crate
